# Fails when plugins/botreeve/ differs from what the botreeve repo's MCP catalog and
# companion skill generate (botreeve main, docs/mcp + skills/botreeve-mcp).
# Runs on pull_request, push to main, daily and on dispatch (the server changes without touching this repo).
# Fix: node scripts/generate.mjs --source <botreeve checkout>, commit.
# Needs repo secret BOTREEVE_READ_TOKEN = read-only SSH deploy key (private key text) for GutenGroup/botreeve.
name: check-plugin
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: guten-linux-light
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch botreeve docs/mcp and skills (read-only, SSH deploy key)
        env:
          KEY: ${{ secrets.BOTREEVE_READ_TOKEN }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 --filter=blob:none --sparse \
            git@github.com:GutenGroup/botreeve.git /tmp/br
          git -C /tmp/br sparse-checkout set docs/mcp skills/botreeve-mcp
          git -C /tmp/br log -1 --format='botreeve %h %cs'
          rm -f ~/.ssh/id
      - name: Plugin matches the catalog
        run: node scripts/generate.mjs --source /tmp/br --check
      - name: Claude validates plugin and marketplace
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate plugins/botreeve --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate .
